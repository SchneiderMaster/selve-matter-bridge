name: Docker Image CI/CD

on:
  push:
    branches: [ "main" ]
  
  workflow_dispatch:

env:
  DOCKER_HUB_REPO: SchneiderMaster/selve-matter-bridge

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (für Multi-Architektur-Support)
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          push: true
          context: .
          tags: |
            # Tag mit der Kurz-Commit-ID (nützlich für spezifische Versionen)
            ${{ env.DOCKER_HUB_REPO }}:${{ github.sha }}
            # Tag mit 'latest' (für die aktuelle stabile Version)
            ${{ env.DOCKER_HUB_REPO }}:latest
          platforms: linux/amd64,linux/arm/v7